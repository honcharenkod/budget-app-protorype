monobank {
  api-url = "https://api.monobank.ua"
  token = ${?MONO_TOKEN}
  statement-request-duration = 31day
  statement-request-delay = 60s
}

postgres {
  url = "jdbc:postgresql://localhost:5432/budget_app"
  url = ${?POSTGRES_URL}
  user = ${?POSTGRES_USER}
  password = ${?POSTGRES_PASSWORD}
  pool-size = 10
}
